name: pcDuino3B fast preflight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pcduino3b-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  # This is both the framework source ref and the last composite Action ref
  # audited by this repository.  The Action is not invoked because that ref's
  # action.yml unconditionally publishes a GitHub Release after compilation.
  ARMBIAN_BUILD_REF: 34e66c37211c70ef5cfad9c80dd76389720e19b7
  LINUX_DTS_REF: v6.18.49
  KERNEL_GIT_REF: tag:v6.18.49

jobs:
  preflight:
    name: Static, board and DT preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Start timer
        shell: bash
        run: echo "PREFLIGHT_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout customizations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install lightweight validators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler shellcheck u-boot-tools

      - name: Validate workflows and shell
        shell: bash
        run: |
          set -euo pipefail
          go run github.com/rhysd/actionlint/cmd/actionlint@03d0035246f3e81f36aed592ffb4bebf33a03106

          mapfile -d '' shell_files < <(
            find userpatches scripts tests -type f \
              \( -name '*.sh' -o -path '*/overlay/usr/local/sbin/pcduino3b-*' \) \
              -print0 2>/dev/null || true
          )
          ((${#shell_files[@]} > 0)) || {
            echo 'No shell files found' >&2
            exit 1
          }
          for file in "${shell_files[@]}"; do
            bash -n "$file"
          done
          shellcheck --severity=error --external-sources "${shell_files[@]}"

      - name: Validate package profiles and repository identity
        shell: bash
        run: |
          set -euo pipefail
          for profile in common dev sd-release nand-installer nand-recovery; do
            manifest="packages/${profile}.txt"
            [[ -s "$manifest" ]] || {
              echo "Missing package manifest: $manifest" >&2
              exit 1
            }
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"
              line="${line//[[:space:]]/}"
              [[ -z "$line" || "$line" =~ ^[a-z0-9][a-z0-9+.-]*(:[a-z0-9]+)?$ ]] || {
                echo "Invalid package name in $manifest: $line" >&2
                exit 1
              }
            done < "$manifest"
          done

          bash scripts/check-pcduino3b-identity.sh
          bash tests/test-pcduino3b-selftest.sh
          bash tests/test-pcduino3b-profile-suffix.sh
          bash tests/test-pcduino3b-wifi-config.sh
          while IFS= read -r test_file; do
            [[ "$test_file" == tests/test-pcduino3b-selftest.sh ]] && continue
            bash "$test_file"
          done < <(find tests -maxdepth 1 -type f -name '*nand*.sh' -print 2>/dev/null | sort)

      - name: Checkout pinned Armbian framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: armbian/build
          ref: ${{ env.ARMBIAN_BUILD_REF }}
          fetch-depth: 1
          path: armbian-framework

      - name: Parse the custom board with the pinned framework
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p armbian-framework/userpatches
          rsync -a userpatches/ armbian-framework/userpatches/

          for branch_series in legacy:6.12 current:6.18 edge:7.1; do
            branch=${branch_series%%:*}
            series=${branch_series#*:}
            config_json="$RUNNER_TEMP/pcduino3b-board-${branch}.json"
            CI=false ANSI_COLOR=none WRITE_EXTENSIONS_METADATA=no \
              CONFIG_DEFS_ONLY=yes armbian-framework/compile.sh config-dump-json \
              BOARD=pcduino3b \
              BRANCH="$branch" \
              RELEASE=noble \
              BUILD_DESKTOP=no \
              BUILD_MINIMAL=yes \
              ENABLE_EXTENSIONS=pcduino3b-gigabit \
              > "$config_json"

            jq '{
              BOARD_NAME, BOARD_VENDOR, BOARDFAMILY, LINUXFAMILY,
              ARCH, BOOTCONFIG, BOOT_FDT_FILE, KERNEL_MAJOR_MINOR
            }' "$config_json"
            jq -e --arg series "$series" '
              .BOARD_NAME == "pcDuino3B" and
              .BOARD_VENDOR == "linksprite" and
              .BOARDFAMILY == "sun7i" and
              .LINUXFAMILY == "sunxi" and
              .ARCH == "armhf" and
              .BOOTCONFIG == "Linksprite_pcDuino3_defconfig" and
              .BOOT_FDT_FILE == "allwinner/sun7i-a20-pcduino3b.dtb" and
              .NETWORKING_STACK == "network-manager" and
              .KERNEL_MAJOR_MINOR == $series
            ' "$config_json"

            recovery_config_json="$RUNNER_TEMP/pcduino3b-board-${branch}-nand-recovery.json"
            CI=false ANSI_COLOR=none WRITE_EXTENSIONS_METADATA=no \
              CONFIG_DEFS_ONLY=yes armbian-framework/compile.sh config-dump-json \
              BOARD=pcduino3b \
              BRANCH="$branch" \
              RELEASE=noble \
              BUILD_DESKTOP=no \
              BUILD_MINIMAL=yes \
              ENABLE_EXTENSIONS=pcduino3b-gigabit \
              PCDUINO3B_IMAGE_PROFILE=nand-recovery \
              > "$recovery_config_json"
            jq -e '
              .BOARD_NAME == "pcDuino3B" and
              .BOOT_FDT_FILE == "allwinner/sun7i-a20-pcduino3b.dtb" and
              .NETWORKING_STACK == "network-manager"
            ' "$recovery_config_json"

            test -s "userpatches/kernel/archive/sunxi-${series}/0001-arm-dts-sun7i-a20-pcduino3b-gigabit.patch"
          done

          pinned_config_json="$RUNNER_TEMP/pcduino3b-board-current-pinned.json"
          CI=false ANSI_COLOR=none WRITE_EXTENSIONS_METADATA=no \
            CONFIG_DEFS_ONLY=yes armbian-framework/compile.sh config-dump-json \
            BOARD=pcduino3b \
            BRANCH=current \
            KERNELBRANCH="$KERNEL_GIT_REF" \
            RELEASE=noble \
            BUILD_DESKTOP=no \
            BUILD_MINIMAL=yes \
            ENABLE_EXTENSIONS=pcduino3b-gigabit \
            > "$pinned_config_json"
          jq -e --arg ref "$KERNEL_GIT_REF" \
            '.KERNEL_MAJOR_MINOR == "6.18" and
             any(.WANT_ARTIFACT_KERNEL_INPUTS_ARRAY[];
                 contains("KERNELBRANCH=" + $ref))' \
            "$pinned_config_json"

      - name: Checkout Linux DTS baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gregkh/linux
          ref: ${{ env.LINUX_DTS_REF }}
          fetch-depth: 1
          path: linux-dts
          sparse-checkout: |
            arch/arm/boot/dts/allwinner
            drivers/mtd/nand/raw
            include/dt-bindings
            include/uapi/linux

      - name: Checkout pinned U-Boot baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: u-boot/u-boot
          ref: v2026.07
          fetch-depth: 1
          path: u-boot
          sparse-checkout: |
            arch/arm/dts
            drivers/mtd/nand/raw
            dts/upstream/include/dt-bindings
            include/configs
            include/dt-bindings

      - name: Apply, compile and inspect the dedicated DTB
        shell: bash
        run: |
          set -euo pipefail
          dts_patch="$GITHUB_WORKSPACE/userpatches/kernel/archive/sunxi-6.18/0001-arm-dts-sun7i-a20-pcduino3b-gigabit.patch"
          nand_id_patch="$GITHUB_WORKSPACE/userpatches/kernel/archive/sunxi-6.18/0002-mtd-rawnand-add-h27ubg8t2c.patch"
          framework_patch="$GITHUB_WORKSPACE/armbian-framework/patch/kernel/archive/sunxi-6.18/patches.armbian/arm-dts-sun7i-a20-pcduino3-add-hdmi.patch"
          # The pcDuino3B DTS includes the compatibility DTS, so reproduce the
          # pinned framework's earlier pcDuino3 HDMI patch before applying the
          # repository patch.  Staging that baseline lets the following diff
          # prove our patch itself does not alter the original pcDuino3 file.
          git -C linux-dts apply --check "$framework_patch"
          git -C linux-dts apply "$framework_patch"
          git -C linux-dts add arch/arm/boot/dts/allwinner/sun7i-a20-pcduino3.dts
          git -C linux-dts apply --check "$dts_patch"
          git -C linux-dts apply "$dts_patch"
          git -C linux-dts apply --whitespace=error-all --check "$nand_id_patch"
          git -C linux-dts apply "$nand_id_patch"
          git -C linux-dts diff --check
          git -C linux-dts diff --exit-code -- arch/arm/boot/dts/allwinner/sun7i-a20-pcduino3.dts
          grep -Fq '0xad, 0xd7, 0x94, 0x91, 0x60, 0x44' \
            linux-dts/drivers/mtd/nand/raw/nand_ids.c
          grep -Fq 'NAND_ECC_INFO(40, SZ_1K)' \
            linux-dts/drivers/mtd/nand/raw/nand_ids.c
          grep -Fq 'const struct mtd_pairing_scheme dist6_pairing_scheme' \
            linux-dts/drivers/mtd/nand/raw/nand_base.c
          grep -Fq 'mtd_set_pairing_scheme(mtd, &dist6_pairing_scheme);' \
            linux-dts/drivers/mtd/nand/raw/nand_hynix.c

          compile_dtb() {
            local source="$1"
            local output="$2"
            cpp -nostdinc \
              -I linux-dts/include \
              -I linux-dts/arch/arm/boot/dts/allwinner \
              -undef -D__DTS__ -x assembler-with-cpp "$source" \
              | dtc -I dts -O dtb -o "$output"
          }

          compile_dtb \
            linux-dts/arch/arm/boot/dts/allwinner/sun7i-a20-pcduino3b.dts \
            "$RUNNER_TEMP/sun7i-a20-pcduino3b.dtb"
          dtc -I dtb -O dts \
            "$RUNNER_TEMP/sun7i-a20-pcduino3b.dtb" \
            > "$RUNNER_TEMP/sun7i-a20-pcduino3b.roundtrip.dts"
          grep -Eq 'model = "LinkSprite pcDuino3B";' \
            "$RUNNER_TEMP/sun7i-a20-pcduino3b.roundtrip.dts"
          grep -Eq 'phy-mode = "rgmii-id";' \
            "$RUNNER_TEMP/sun7i-a20-pcduino3b.roundtrip.dts"

          overlay="$GITHUB_WORKSPACE/userpatches/dts/sun7i-a20-pcduino3b-nand-recovery.dtso"
          overlay_blob="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-recovery.dtbo"
          overlay_stderr="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-recovery.stderr"
          dtc -@ -I dts -O dtb -o "$overlay_blob" "$overlay" 2> "$overlay_stderr"
          [[ ! -s "$overlay_stderr" ]] || {
            cat "$overlay_stderr" >&2
            exit 1
          }
          overlay_recovery_dtb="$RUNNER_TEMP/sun7i-a20-pcduino3b-overlay-recovery.dtb"
          fdtoverlay \
            -i "$RUNNER_TEMP/sun7i-a20-pcduino3b.dtb" \
            -o "$overlay_recovery_dtb" \
            "$overlay_blob"

          base_nfc=/soc/nand-controller@1c03000
          recovery_nand=$base_nfc/nand@0
          [[ "$(fdtget -t s "$overlay_recovery_dtb" / model)" == 'LinkSprite pcDuino3B' ]]
          [[ "$(fdtget -t s "$overlay_recovery_dtb" /soc/ethernet@1c50000 phy-mode)" == rgmii-id ]]
          [[ "$(fdtget -t s "$overlay_recovery_dtb" "$base_nfc" status)" == okay ]]
          [[ "$(fdtget -t x "$overlay_recovery_dtb" "$recovery_nand" reg)" == 0 ]]
          [[ "$(fdtget -t x "$overlay_recovery_dtb" "$recovery_nand" allwinner,rb)" == 0 ]]
          [[ "$(fdtget -t s "$overlay_recovery_dtb" "$recovery_nand" nand-ecc-mode)" == hw ]]
          if fdtget -l "$overlay_recovery_dtb" "$recovery_nand" | grep -qx partitions; then
            echo 'Recovery overlay must not declare a partition map' >&2
            exit 1
          fi

          layout_overlay="$GITHUB_WORKSPACE/userpatches/dts/sun7i-a20-pcduino3b-nand-layout.dtso"
          layout_blob="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-layout.dtbo"
          layout_stderr="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-layout.stderr"
          dtc -@ -I dts -O dtb -o "$layout_blob" "$layout_overlay" 2> "$layout_stderr"
          [[ ! -s "$layout_stderr" ]] || {
            cat "$layout_stderr" >&2
            exit 1
          }
          layout_dtb="$RUNNER_TEMP/sun7i-a20-pcduino3b-layout.dtb"
          fdtoverlay \
            -i "$RUNNER_TEMP/sun7i-a20-pcduino3b.dtb" \
            -o "$layout_dtb" \
            "$layout_blob"
          layout_partitions=$recovery_nand/partitions
          [[ "$(fdtget -t s "$layout_dtb" / model)" == 'LinkSprite pcDuino3B' ]]
          [[ "$(fdtget -t s "$layout_dtb" /soc/ethernet@1c50000 phy-mode)" == rgmii-id ]]
          [[ "$(fdtget -t s "$layout_dtb" "$base_nfc" status)" == okay ]]
          [[ "$(fdtget -t s "$layout_dtb" "$layout_partitions" compatible)" == fixed-partitions ]]
          [[ "$(fdtget -t x "$layout_dtb" "$layout_partitions/partition@0" reg)" == '0 400000' ]]
          [[ "$(fdtget -t x "$layout_dtb" "$layout_partitions/partition@400000" reg)" == '400000 400000' ]]
          [[ "$(fdtget -t x "$layout_dtb" "$layout_partitions/partition@800000" reg)" == '800000 1800000' ]]
          [[ "$(fdtget -t s "$layout_dtb" "$layout_partitions/partition@2000000" label)" == bootfit ]]
          [[ "$(fdtget -t x "$layout_dtb" "$layout_partitions/partition@2000000" reg)" == '2000000 6000000' ]]
          [[ "$(fdtget -t s "$layout_dtb" "$layout_partitions/partition@8000000" label)" == rootfs ]]
          [[ "$(fdtget -t x "$layout_dtb" "$layout_partitions/partition@8000000" reg)" == '8000000 f8000000' ]]
          fdtget -p "$layout_dtb" "$layout_partitions/partition@8000000" \
            | grep -qx slc-mode

          # Exercise the exact ITS and the notifier-only runtime DT mutation.
          # The checked-in SD installer overlay must remain free of linux,ubi.
          runtime_dtb="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-runtime.dtb"
          cp "$layout_dtb" "$runtime_dtb"
          rootfs_partition="$layout_partitions/partition@8000000"
          fdtput -t s "$runtime_dtb" "$rootfs_partition" compatible linux,ubi
          [[ "$(fdtget -t s "$runtime_dtb" "$rootfs_partition" compatible)" == linux,ubi ]]
          fdtget -p "$runtime_dtb" "$rootfs_partition" | grep -qx slc-mode
          if grep -Fq 'linux,ubi' "$layout_overlay"; then
            echo 'Installer overlay must not auto-attach UBI before validation' >&2
            exit 1
          fi

          fit_dir="$RUNNER_TEMP/pcduino3b-nand-fit-fixture"
          mkdir -p "$fit_dir"
          printf 'kernel-fixture' > "$fit_dir/zImage"
          printf 'initramfs-fixture' > "$fit_dir/initrd.img"
          cp "$runtime_dtb" "$fit_dir/pcduino3b-nand-runtime.dtb"
          cp "$GITHUB_WORKSPACE/userpatches/pcduino3b-nand-boot.its" \
            "$fit_dir/pcduino3b-nand-boot.its"
          (
            cd "$fit_dir"
            SOURCE_DATE_EPOCH=0 mkimage -f pcduino3b-nand-boot.its \
              pcduino3b-nand-boot.itb >/dev/null
            dumpimage -l pcduino3b-nand-boot.itb > fit-list.txt
          )
          grep -Fq 'pcDuino3B NAND boot FIT' "$fit_dir/fit-list.txt"
          [[ "$(grep -Fc 'Hash algo:    sha256' "$fit_dir/fit-list.txt")" -eq 3 ]]

          compile_dtb \
            linux-dts/arch/arm/boot/dts/allwinner/sun7i-a20-pcduino3b-nand-recovery.dts \
            "$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-recovery.dtb"
          recovery_dtb="$RUNNER_TEMP/sun7i-a20-pcduino3b-nand-recovery.dtb"
          [[ "$(fdtget -t s "$recovery_dtb" / model)" == 'LinkSprite pcDuino3B' ]]
          [[ "$(fdtget -t s "$recovery_dtb" /soc/ethernet@1c50000 phy-mode)" == rgmii-id ]]
          [[ "$(fdtget -t s "$recovery_dtb" "$base_nfc" status)" == okay ]]
          [[ "$(fdtget -t x "$recovery_dtb" "$recovery_nand" reg)" == 0 ]]
          [[ "$(fdtget -t x "$recovery_dtb" "$recovery_nand" allwinner,rb)" == 0 ]]
          [[ "$(fdtget -t s "$recovery_dtb" "$recovery_nand" nand-ecc-mode)" == hw ]]
          if fdtget -p "$recovery_dtb" "$recovery_nand" | grep -qx nand-on-flash-bbt; then
            echo 'Recovery DTB must not enable persistent on-flash BBT' >&2
            exit 1
          fi
          if fdtget -l "$recovery_dtb" "$recovery_nand" | grep -qx partitions; then
            echo 'Recovery DTB must not declare a partition map' >&2
            exit 1
          fi

          base_dtb="$RUNNER_TEMP/sun7i-a20-pcduino3b.dtb"
          [[ "$(fdtget -t s "$base_dtb" "$base_nfc" status)" == disabled ]]

          compile_dtb \
            linux-dts/arch/arm/boot/dts/allwinner/sun7i-a20-pcduino3.dts \
            "$RUNNER_TEMP/sun7i-a20-pcduino3.dtb"
          dtc -I dtb -O dts "$RUNNER_TEMP/sun7i-a20-pcduino3.dtb" \
            > "$RUNNER_TEMP/sun7i-a20-pcduino3.roundtrip.dts"
          grep -Eq 'model = "LinkSprite pcDuino3";' \
            "$RUNNER_TEMP/sun7i-a20-pcduino3.roundtrip.dts"
          grep -Eq 'phy-mode = "mii";' \
            "$RUNNER_TEMP/sun7i-a20-pcduino3.roundtrip.dts"

      - name: Validate NAND-capable U-Boot patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/userpatches/u-boot/v2026.07-sunxi/board_pcduino3b/0001-pcduino3b-enable-onboard-nand.patch"
          git -C u-boot apply --check "$patch"
          git -C u-boot apply "$patch"
          git -C u-boot diff --check

          grep -Fq '0xad, 0xd7, 0x94, 0x91, 0x60, 0x44' \
            u-boot/drivers/mtd/nand/raw/nand_ids.c
          grep -Fq 'NAND_ECC_INFO(40, SZ_1K), 0' \
            u-boot/drivers/mtd/nand/raw/nand_ids.c
          grep -Fq 'ecc_bytes[ecc_idx] * nsectors + total_user_data_sz >' \
            u-boot/drivers/mtd/nand/raw/sunxi_nand_spl.c
          if grep -Fq 'ecc_bytes[ecc_idx] + total_user_data_sz > max_ecc_bytes' \
            u-boot/drivers/mtd/nand/raw/sunxi_nand_spl.c; then
            echo 'U-Boot still contains the v2026.07 SPL ECC unit mismatch' >&2
            exit 1
          fi
          git -C u-boot diff --exit-code -- arch/arm/dts/sun7i-a20-pcduino3.dts
          uboot_dts=u-boot/arch/arm/dts/sun7i-a20-pcduino3b.dts
          grep -Fq 'model = "LinkSprite pcDuino3B";' "$uboot_dts"
          grep -Fq 'phy-mode = "rgmii-id";' "$uboot_dts"
          grep -Fq 'pcduino3b_nand_pins: nand-pins' "$uboot_dts"
          grep -Fq '&nfc {' "$uboot_dts"
          for label in spl-primary spl-backup uboot bootfit rootfs; do
            grep -Fq "label = \"$label\";" "$uboot_dts"
          done

          cpp -nostdinc \
            -I u-boot/arch/arm/dts \
            -I u-boot/arch/arm/dts/include \
            -I u-boot/dts/upstream/include \
            -I u-boot/include \
            -undef -D__DTS__ -x assembler-with-cpp "$uboot_dts" \
            | dtc -I dts -O dtb -o "$RUNNER_TEMP/sun7i-a20-pcduino3b-u-boot.dtb"
          [[ "$(fdtget -t s "$RUNNER_TEMP/sun7i-a20-pcduino3b-u-boot.dtb" / model)" == 'LinkSprite pcDuino3B' ]]
          [[ "$(fdtget -t s "$RUNNER_TEMP/sun7i-a20-pcduino3b-u-boot.dtb" /soc/ethernet@1c50000 phy-mode)" == rgmii-id ]]
          [[ "$(fdtget -t s "$RUNNER_TEMP/sun7i-a20-pcduino3b-u-boot.dtb" /soc/nand-controller@1c03000 status)" == okay ]]
          if grep -Fq 'BOOT_TARGET_DEVICES_UBIFS' \
            u-boot/include/configs/sunxi-common.h; then
            echo 'U-Boot must not contain the removed UBIFS boot target' >&2
            exit 1
          fi

      - name: Preflight summary
        if: always()
        shell: bash
        run: |
          elapsed=$(( $(date +%s) - PREFLIGHT_STARTED ))
          {
            echo '## pcDuino3B fast preflight'
            echo
            echo "- Result: **${{ job.status }}**"
            echo "- Elapsed: $((elapsed / 60))m $((elapsed % 60))s"
            echo "- Armbian framework: \`$ARMBIAN_BUILD_REF\`"
            echo '- Full rootfs/image build: not run'
          } >> "$GITHUB_STEP_SUMMARY"
